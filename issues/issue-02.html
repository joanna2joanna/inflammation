<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>李大妈的生活化抗炎笔记 第2期</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }

  :root {
    --bg:       #DEE4EB;
    --card:     #FFFFFF;
    --gold:     #A67C2E;
    --text:     #1E293B;
    --muted:    #5B6A7C;
    --divider:  #C8CFD8;
    --tcm-bg:   #DCE8DB;
    --tcm-border:#7A9F74;
    --tcm-text:  #3D5C38;
    --west-bg:   #D9E4F0;
    --west-border:#6A8FB5;
    --west-text:  #3A5F85;
  }

  body {
    max-width: 1080px;
    margin: 0 auto;
    background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
  }

  .top-bar {
    width: 100%; height: 6px;
    background: linear-gradient(90deg, var(--gold) 0%, #8BA3C0 100%);
  }

  .container { padding: 52px 58px 48px 58px; }

  .hero { text-align: center; margin-bottom: 48px; }
  .hero h1 {
    font-size: 110px; font-weight: 900; color: var(--gold);
    line-height: 1.12; letter-spacing: 4px; margin-bottom: 22px;
    text-wrap: pretty;
  }
  .hero .hook {
    font-size: 46px; font-weight: 700; color: var(--text);
    line-height: 1.4; text-wrap: pretty;
  }
  .hero .hook em {
    font-style: normal; color: var(--gold);
    background: linear-gradient(180deg, transparent 62%, rgba(166,124,46,0.2) 62%);
    padding: 0 6px;
  }

  .compare {
    display: flex; gap: 28px; margin-bottom: 48px; align-items: stretch;
  }
  .col {
    flex: 1; border-radius: 20px; padding: 36px 32px 32px 32px;
    text-align: center;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 320px;
  }
  .col.tcm-col { background: var(--tcm-bg); border: 3px solid var(--tcm-border); }
  .col.west-col { background: var(--west-bg); border: 3px solid var(--west-border); }

  .col .label { font-size: 34px; font-weight: 600; margin-bottom: 24px; }
  .col.tcm-col .label { color: var(--tcm-text); }
  .col.west-col .label { color: var(--west-text); }

  .col .concept { font-size: 76px; font-weight: 900; line-height: 1.15; margin-bottom: 16px; }
  .col.tcm-col .concept { color: var(--tcm-text); }
  .col.west-col .concept { color: var(--west-text); }

  .col .desc { font-size: 32px; font-weight: 500; color: var(--muted); line-height: 1.65; text-wrap: pretty; }

  .action-card {
    background: var(--card); border-radius: 22px;
    padding: 44px 48px 36px 48px; margin-bottom: 48px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .action-card .card-title {
    font-size: 40px; font-weight: 800; color: var(--gold);
    margin-bottom: 28px; text-wrap: pretty;
  }
  .action-list { list-style: none; padding: 0; }
  .action-list li {
    display: flex; align-items: flex-start;
    padding: 24px 0; border-bottom: 1.5px solid var(--divider);
  }
  .action-list li:last-child { border-bottom: none; padding-bottom: 0; }

  .action-list .num {
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--gold); color: #FFF;
    font-size: 26px; font-weight: 800; line-height: 50px;
    text-align: center; flex-shrink: 0; margin-right: 18px;
  }

  .action-list .body { flex: 1; min-width: 0; }

  .action-list .what {
    font-size: 40px; font-weight: 700; color: var(--text);
    line-height: 1.45; text-wrap: pretty;
  }
  .action-list .why {
    font-size: 32px; font-weight: 400; color: var(--muted);
    line-height: 1.55; margin-top: 6px; padding-left: 4px;
    text-wrap: pretty;
  }
  .action-list .why::before { content: "→ "; color: var(--gold); font-weight: 600; }

  .footer { text-align: center; padding-top: 20px; border-top: 3px solid var(--gold); }
  .footer .disclaimer { font-size: 22px; font-weight: 400; color: #8B9AAD; margin-top: 14px; }
  .footer .brand { font-size: 28px; font-weight: 900; color: #9AABC0; letter-spacing: 5px; }

/* NAV: back-to-top + home */
.nav-fixed{position:fixed;bottom:28px;right:28px;z-index:9999;display:flex;flex-direction:column;gap:12px}
.nav-btn{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,0.25);border:1px solid rgba(0,0,0,0.1);color:#666;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s;line-height:1;user-select:none}
.nav-btn:hover{background:rgba(0,0,0,0.4);color:#fff}
#back-to-top{display:none}
</style>
</head>
<body>
<div class="top-bar"></div>
<div class="container">
  <div class="hero">
    <h1>油烟呛不是上火</h1>
    <p class="hook">炝锅吸进去的油烟微粒，<em>当场</em>让呼吸道发炎</p>
  </div>
  <div class="compare">
    <div class="col tcm-col">
      <div class="label">🍃 中医视角</div>
      <div class="concept">燥热伤肺</div>
      <div class="desc">油烟属燥邪，耗伤肺津<br>肺失润降，干咳咽痒</div>
    </div>
    <div class="col west-col">
      <div class="label">🔬 西医视角</div>
      <div class="concept">吸入性炎症</div>
      <div class="desc">微粒激活呼吸道炎性通路<br>促炎因子当场大量释放</div>
    </div>
  </div>
  <div class="action-card">
    <div class="card-title">💡 下厨前做这三件事</div>
    <ul class="action-list">
      <li>
        <div class="num">1</div>
        <div class="body">
          <div class="what">开窗再开火，再开油烟机</div>
          <div class="why">通风加油烟机，PM2.5散掉九成</div>
        </div>
      </li>
      <li>
        <div class="num">2</div>
        <div class="body">
          <div class="what">油烧到五六成热就下菜</div>
          <div class="why">冒烟时油温已超200℃，有害物大量跑出来</div>
        </div>
      </li>
      <li>
        <div class="num">3</div>
        <div class="body">
          <div class="what">炒完菜喝杯温水润一润</div>
          <div class="why">温水把嗓子里的刺激物冲一冲，好得快</div>
        </div>
      </li>
    </ul>
  </div>
  <div class="footer">
    <div class="brand">李大妈的生活化抗炎笔记</div>
    <div class="disclaimer">以上内容为特定切入点的生活化科普，不构成医学诊断意见。</div>
  </div>
</div></div>
<div class="nav-fixed">
<a id="back-to-top" class="nav-btn" href="#" title="回到顶部">&uarr;</a>
<a class="nav-btn" href="../review.html" title="回到首页">&lceil;</a>
</div>
<script>
(function(){
var b=document.getElementById('back-to-top');
window.addEventListener('scroll',function(){b.style.display=window.scrollY>400?'flex':'none'});
b.addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})});
})();
</script>
</body>
</html>
